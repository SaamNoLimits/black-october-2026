<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="LiteLLM 1.107.0 supply-chain attack flow">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5a4d"/>
    </marker>
  </defs>

  <rect width="1280" height="520" fill="url(#lbg)"/>
  <text x="40" y="46" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="24" font-weight="800" fill="#f0f6fc">LITELLM 1.107.0 · SUPPLY-CHAIN FLOW</text>
  <text x="42" y="70" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="14" fill="#c792ea" letter-spacing="1">one committed secret (May) → poisoned release (Oct 21) → secrets stolen before you even import it</text>

  <!-- connectors -->
  <g fill="none" stroke="#c9d1d9" stroke-width="3.5">
    <line x1="262" y1="165" x2="316" y2="165" marker-end="url(#aw)"/>
    <line x1="522" y1="165" x2="576" y2="165" marker-end="url(#aw)"/>
    <line x1="782" y1="165" x2="836" y2="165" marker-end="url(#aw)"/>
    <!-- turn down from B4 to B5 -->
    <path d="M1042,165 L1140,165 L1140,370 L1046,370" marker-end="url(#aw)"/>
    <!-- row2 right-to-left -->
    <line x1="818" y1="370" x2="766" y2="370" marker-end="url(#aw)"/>
    <line x1="558" y1="370" x2="506" y2="370" marker-end="url(#aw)"/>
  </g>
  <!-- final arrow into exfil (red) -->
  <line x1="298" y1="370" x2="246" y2="370" fill="none" stroke="#ff5a4d" stroke-width="4" marker-end="url(#ar)" />

  <!-- ===== row 1 (vendor side, purple) ===== -->
  <g font-family="'Segoe UI',system-ui,Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="42" y="121" width="220" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="42" y="121" width="6" height="88" rx="3" fill="#c792ea"/>
      <text x="152" y="152" font-size="14" font-weight="800" fill="#cf9cee">1 · Secret leaked</text>
      <text x="152" y="174" font-size="12.5" fill="#c9d1d9">master key committed to</text>
      <text x="152" y="191" font-size="12.5" fill="#c9d1d9">a public repo · May 27</text>
    </g>
    <g>
      <rect x="302" y="121" width="220" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="302" y="121" width="6" height="88" rx="3" fill="#c792ea"/>
      <text x="412" y="152" font-size="14" font-weight="800" fill="#cf9cee">2 · Token stolen</text>
      <text x="412" y="174" font-size="12.5" fill="#c9d1d9">key → GitHub OAuth token</text>
      <text x="412" y="191" font-size="12.5" fill="#c9d1d9">owner access · Oct 10</text>
    </g>
    <g>
      <rect x="562" y="121" width="220" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="562" y="121" width="6" height="88" rx="3" fill="#c792ea"/>
      <text x="672" y="152" font-size="14" font-weight="800" fill="#cf9cee">3 · Release poisoned</text>
      <text x="672" y="174" font-size="12.5" fill="#c9d1d9">malicious 1.107.0 built</text>
      <text x="672" y="191" font-size="12.5" fill="#c9d1d9">Oct 21 · ~2-hr window</text>
    </g>
    <g>
      <rect x="822" y="121" width="220" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="822" y="121" width="6" height="88" rx="3" fill="#c792ea"/>
      <text x="932" y="152" font-size="14" font-weight="800" fill="#cf9cee">4 · Distributed</text>
      <text x="932" y="174" font-size="12.5" fill="#c9d1d9">PyPI (7 wheels) +</text>
      <text x="932" y="191" font-size="12.5" fill="#c9d1d9">Docker: latest, main-*</text>
    </g>

    <!-- ===== row 2 (victim side, orange / red) ===== -->
    <g>
      <rect x="822" y="326" width="222" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="822" y="326" width="6" height="88" rx="3" fill="#ff9f40"/>
      <text x="933" y="357" font-size="14" font-weight="800" fill="#ffab54">5 · Victim installs</text>
      <text x="933" y="379" font-size="12.5" fill="#c9d1d9">pip install / docker pull</text>
      <text x="933" y="396" font-size="12.5" fill="#c9d1d9">CI runner, proxy container</text>
    </g>
    <g>
      <rect x="562" y="326" width="222" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="562" y="326" width="6" height="88" rx="3" fill="#ff9f40"/>
      <text x="673" y="353" font-size="14" font-weight="800" fill="#ffab54">6 · cook.pth runs</text>
      <text x="673" y="374" font-size="12.5" fill="#c9d1d9">at Python start — BEFORE</text>
      <text x="673" y="391" font-size="12.5" fill="#c9d1d9">any import; survives removal</text>
    </g>
    <g>
      <rect x="302" y="326" width="222" height="88" rx="10" fill="#161b22" stroke="#21262d"/>
      <rect x="302" y="326" width="6" height="88" rx="3" fill="#ff9f40"/>
      <text x="413" y="353" font-size="14" font-weight="800" fill="#ffab54">7 · privcollect</text>
      <text x="413" y="374" font-size="12.5" fill="#c9d1d9">steals 16 categories: cloud,</text>
      <text x="413" y="391" font-size="12.5" fill="#c9d1d9">AI keys, browser, proxy creds</text>
    </g>
    <g>
      <rect x="42" y="326" width="222" height="88" rx="10" fill="#1f1413" stroke="#5a2420"/>
      <rect x="42" y="326" width="6" height="88" rx="3" fill="#ff5a4d"/>
      <text x="153" y="357" font-size="14" font-weight="800" fill="#ff6a5a">8 · Exfil · GOAL</text>
      <text x="153" y="379" font-size="12.5" fill="#e6b3ae">GZIP-TAR POST →</text>
      <text x="153" y="396" font-size="12.5" fill="#e6b3ae">litellm.dev/healthcheck</text>
    </g>
  </g>

  <text x="40" y="492" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="12.5" fill="#6e7681">Defense: rotate every secret an affected host could read — removing the package is NOT enough. Scan CI for install-time (.pth) execution.</text>
</svg>
