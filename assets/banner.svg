<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Black October 2026 — AI Red-Team Threat Intelligence Package">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="0.5" stop-color="#ff3d3d"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="6" fill="url(#accent)"/>
  <rect y="334" width="1280" height="6" fill="url(#accent)"/>

  <!-- faint vertical grid -->
  <g stroke="#1b2230" stroke-width="1">
    <line x1="160" y1="20" x2="160" y2="320"/>
    <line x1="320" y1="20" x2="320" y2="320"/>
    <line x1="480" y1="20" x2="480" y2="320"/>
    <line x1="640" y1="20" x2="640" y2="320"/>
    <line x1="800" y1="20" x2="800" y2="320"/>
    <line x1="960" y1="20" x2="960" y2="320"/>
    <line x1="1120" y1="20" x2="1120" y2="320"/>
  </g>

  <!-- decorative warning glyph, right side -->
  <g transform="translate(1080,172)" opacity="0.5">
    <circle r="118" fill="url(#ghost)"/>
    <path d="M0,-78 L86,66 L-86,66 Z" fill="none" stroke="#ff5a3d" stroke-width="5" stroke-linejoin="round" opacity="0.55"/>
    <rect x="-7" y="-28" width="14" height="60" rx="6" fill="#ff5a3d" opacity="0.7"/>
    <circle cx="0" cy="48" r="9" fill="#ff5a3d" opacity="0.7"/>
  </g>

  <!-- TLP chip -->
  <g transform="translate(1040,40)">
    <rect width="150" height="30" rx="15" fill="none" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="22" cy="15" r="5" fill="#2ea043"/>
    <text x="38" y="20" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#3fb950" letter-spacing="1.5">TLP:CLEAR</text>
  </g>

  <!-- title -->
  <text x="68" y="135" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="1" fill="#f0f6fc">BLACK OCTOBER <tspan fill="#ff4d3d">2026</tspan></text>

  <text x="72" y="180" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="5" fill="#8b949e">AI RED-TEAM THREAT INTELLIGENCE PACKAGE</text>

  <line x1="72" y1="206" x2="760" y2="206" stroke="#30363d" stroke-width="1.5"/>

  <!-- pills -->
  <g font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">
    <g transform="translate(70,232)">
      <rect width="158" height="34" rx="17" fill="#161b22" stroke="#ff5a3d" stroke-opacity="0.5"/>
      <text x="79" y="22" text-anchor="middle" letter-spacing="1">11 CASE STUDIES</text>
    </g>
    <g transform="translate(240,232)">
      <rect width="120" height="34" rx="17" fill="#161b22" stroke="#ff5a3d" stroke-opacity="0.5"/>
      <text x="60" y="22" text-anchor="middle" letter-spacing="1">40+ CVEs</text>
    </g>
    <g transform="translate(372,232)">
      <rect width="246" height="34" rx="17" fill="#161b22" stroke="#8957e5" stroke-opacity="0.6"/>
      <text x="123" y="22" text-anchor="middle" letter-spacing="1">SIGMA · YARA · SURICATA</text>
    </g>
    <g transform="translate(630,232)">
      <rect width="150" height="34" rx="17" fill="#161b22" stroke="#dea584" stroke-opacity="0.6"/>
      <text x="75" y="22" text-anchor="middle" letter-spacing="1">RUST TOOLKIT</text>
    </g>
  </g>

  <text x="72" y="300" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="13" fill="#6e7681" letter-spacing="1">Detections · IOCs · ATT&amp;CK mapping · mitigation playbook — built from public reporting, for defenders.</text>
</svg>
